server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hr-saas-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hr_saas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  brevo:
    api-key: ${BREVO_API_KEY}
    api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM_ADDRESS:no-reply@hrsaas.com}
  invite:
    expiration-hours: ${INVITE_EXPIRATION_HOURS:72}
